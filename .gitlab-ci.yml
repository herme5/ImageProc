# Linting and testing moved to GitHub Actions (.github/workflows/tests.yml). Both jobs needed a macOS
# runner with Xcode, and the self-hosted one this project used has been unavailable since August 2023:
# every job since ended as `stuck_pending_no_matching_runners`, which is how 2.0.0 through 2.3.0 came to
# be tagged from an untested commit. GitHub hosts macOS runners for public repositories, and the mirror
# carries every push there, so that is where the suite runs now.
#
# What is left here is the release entry. It still needs a runner: `release-cli` is a Linux image, so
# either the shared runners have to be available to this project, or the job has to be picked up by a
# runner that can run a container.

stages:
  - release

Release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Swift Package Manager has no publish step: consumers resolve the git tag directly, which is why a
    # release with no entry here still installs. The entry is a record, not a distribution channel.
    - echo "Releasing ImageProc $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release created using the release-cli.'
