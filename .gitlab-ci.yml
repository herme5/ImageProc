variables:
  LC_ALL: "en_US.UTF-8" # Needed for xcpretty to work

stages:
  - lint
  - test
  - release

Lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - swiftlint --strict

Run Tests:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  parallel:
    matrix:
      - DST_PLATFORM_CI: iOS Simulator
        DST_NAME_CI:
          - iPad (A16)
  script:
    # The Core Image kernels are compiled by the CIKernelCompiler build tool plugin, and since
    # Xcode 26 the Metal compiler is a separately downloadable component rather than part of
    # Xcode itself. This is a no-op once the runner has it.
    - xcodebuild -downloadComponent MetalToolchain
    - echo "Testing ImageProc ($DST_PLATFORM_CI - $DST_NAME_CI)"
    - xcodebuild test -scheme ImageProc -destination "platform=$DST_PLATFORM_CI,name=$DST_NAME_CI" | xcpretty -s
    - xcodebuild build -project Demo/ImageProcApp.xcodeproj -scheme ImageProcApp -destination "platform=$DST_PLATFORM_CI,name=$DST_NAME_CI" | xcpretty

Release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Swift Package Manager has no publish step: consumers resolve the git tag directly.
    - echo "Releasing ImageProc $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release created using the release-cli.'
